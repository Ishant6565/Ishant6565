name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Ishant6565
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          filename: assets/metrics.isocalendar.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
